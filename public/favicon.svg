  <rect width="64" height="64" rx="13" fill="url(#sea)"/>

  <g transform="translate(-0.76 0.92) scale(1.05)">
    <!-- Mainland: tall continent, narrow west waist, bulging south-east -->
    <path d="M28 8.2 L31 4.9 L37 4 L44 4.9 L50 4 L52 18.6 L50 25.2 L53.5 35.5 L53 43
